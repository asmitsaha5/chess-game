services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chess_game
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_game"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      PORT: 5000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: chess_game
      PGUSER: chess
      PGPASSWORD: chess
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
